[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  # shared/ holds pure modules imported by both src/ and netlify/functions/ (e.g. the
  # market calendar). Static imports are traced automatically; this keeps it explicit.
  # Netlify bundles shared/** into every function; the test files there are never imported, so they stay out.
  included_files = ["shared/**", "!shared/**/*.test.js"]
