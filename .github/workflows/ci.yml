name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        # Non-blocking until the remaining react-hooks errors are closed (roadmap Phases 2/5).
        continue-on-error: true
        run: npm run lint
      # - run: npm run typecheck   # enable in Phase 5 (TypeScript)
      # - run: npm test            # enable in Phase 4b (Vitest)
      - name: Verify functions (auth, cost controls, validation)
        run: npm run verify:functions
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
