version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      eslint:
        patterns: ["eslint*", "@eslint/*", "globals"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "msw"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
